name: ACnora · Build i GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instal·lar dependències
        run: npm ci
      - name: Comprovar TypeScript
        run: npm run lint
      - name: Proves de dades i dates
        run: npm test
      - name: Compilar ACnora
        run: npm run build
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar artefacte
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
